name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run catalog:audit
      - run: npm run affiliate:audit
      - run: npm run media:audit
      # Sin credenciales de Amazon el snapshot está vacío y el gate pasa: lo
      # que se comprueba aquí es que el build por defecto sigue siendo válido
      # y que el gate no bloquea un checkout limpio.
      - run: npm run amazon:gate
